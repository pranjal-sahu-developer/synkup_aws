name: Deploy to ECS Fargate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: synkup

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_STREAM_API_KEY="${{ secrets.VITE_STREAM_API_KEY }}" \
            -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" \
            -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

      - name: Force new deployment on ECS
        run: |
          aws ecs update-service --cluster "${{ secrets.ECS_CLUSTER }}" --service "${{ secrets.ECS_SERVICE }}" --force-new-deployment --region ${{ env.AWS_REGION }}
